name: Jellyfilter
description: Jellyfilter helps you choose a movie from your Jellyfin library. Browse the poster grid, swipe through titles, or shuffle for a pick.
repository: https://github.com/rigerc/jellyfilter
docs: https://github.com/rigerc/jellyfilter#readme
download: https://github.com/rigerc/jellyfilter/releases/latest
headline: Find a movie to watch.
intro: Browse the movies on your Jellyfin server, swipe to make a shortlist, or shuffle for a pick.
screenshots:
  - image: ../../assets/screenshots/grid.webp
    label: Grid
    description: Browse and sort your poster library.
    alt: Jellyfilter Grid mode showing a two-column library of movie posters.
  - image: ../../assets/screenshots/swipe.webp
    label: Swipe
    description: Like, pass, or save a movie to your shortlist.
    alt: Jellyfilter Swipe mode showing a movie card and controls to pass, open details, or like.
  - image: ../../assets/screenshots/shuffle.webp
    label: Shuffle
    description: Pick from your filtered movies, shortlist, or recommendations.
    alt: Jellyfilter Shuffle mode showing the movie selected by the reel.
seo:
  image: /og-image.jpg
  imageAlt: Jellyfilter. Find a movie to watch. Beside the text is Jellyfilter’s poster grid.
  imageWidth: 1200
  imageHeight: 630
