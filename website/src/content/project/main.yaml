name: Jellyfilter
description: Jellyfilter helps you choose a movie or TV show from your Jellyfin library. Browse posters or a list, swipe through titles, or let Shuffle pick one.
repository: https://github.com/rigerc/jellyfilter
docs: https://github.com/rigerc/jellyfilter#readme
download: https://github.com/rigerc/jellyfilter/releases/latest
headline: Find something to watch.
intro: Browse your Jellyfin movies and TV shows as posters or a list, swipe to build a shortlist, or let Shuffle pick one.
screenshots:
  - image: ../../assets/screenshots/browse.webp
    label: Browse
    description: Scroll your posters and sort them your way.
    alt: Jellyfilter's Browse tab showing a two-column grid of movie posters with each title, year, and runtime.
  - image: ../../assets/screenshots/browse-list.webp
    label: List
    description: Compare ratings, runtime, and genres at a glance.
    alt: Jellyfilter's Browse tab as a list, with a small poster, year, runtime, content rating, scores, and genres for each movie.
  - image: ../../assets/screenshots/swipe.webp
    label: Swipe
    description: Like, pass, or save a movie to your shortlist.
    alt: Jellyfilter's Swipe tab showing a movie card with buttons to pass, open details, add to a playlist, or like.
  - image: ../../assets/screenshots/shuffle.webp
    label: Shuffle
    description: Spin from your filtered movies, For you, or your shortlist.
    alt: Jellyfilter's Shuffle tab after landing on The Phantom of the Opera, with choices to spin from filtered titles, For you, or the shortlist.
  - image: ../../assets/screenshots/shows.webp
    label: Shows
    description: Switch to TV shows and see how many episodes you have left.
    alt: Jellyfilter's Browse tab switched to Shows, with Star Trek, The Twilight Zone, The Addams Family, and I Love Lucy. Started shows carry a badge with the episodes left and a progress bar.
  - image: ../../assets/screenshots/show-episodes.webp
    label: Episodes
    description: Pick up with the next episode and track each season.
    alt: Star Trek's details on the Episodes tab, with Mirror, Mirror as the next episode and Season 1 watched, Season 2 part-way, and Season 3 not started.
tour:
  label: Jellyfilter tour. The Browse grid scrolls and switches to a list, two movies are selected, a movie is liked and another passed in Swipe, and Shuffle spins and lands on a pick. Then the header switches to TV shows, and Star Trek's Episodes tab shows the next episode and progress for each season.
  note: Recorded from the app with a sample library. No sound.
seo:
  image: /og-image.jpg
  imageAlt: Jellyfilter. Find something to watch. Beside the text is Jellyfilter's Browse tab with a grid of movie posters.
  imageWidth: 1200
  imageHeight: 630
